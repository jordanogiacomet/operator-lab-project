apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b

spec:
  replicas: 1

  selector:
    matchLabels:
      app: service-b

  template:
    metadata:
      labels:
        app: service-b

    spec:
      containers:
        - name: service-b
          image: operator-lab/service-b:v0.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8082

          env:
            - name: SERVICE_A_URL
              value: "http://service-a:8080"

---
apiVersion: v1
kind: Service
metadata:
  name: service-b

spec:
  selector:
    app: service-b

  ports:
    - port: 8080
      targetPort: 8082